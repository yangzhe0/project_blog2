<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 生态：三层装备如何分工</title>
  <desc id="desc">左侧展示工具底座、Plugins 插件层、Skills 技能层，右侧展示提示词弹药库。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="0.48" stop-color="#F8F4FF"/>
      <stop offset="1" stop-color="#FFF8ED"/>
    </linearGradient>
    <linearGradient id="skill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D4AE8"/>
    </linearGradient>
    <linearGradient id="plugin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30B9CE"/>
      <stop offset="1" stop-color="#1599B3"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#F38B45"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#F18A35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#473B75" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#473B75" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1 8 L5 2 L9 8" fill="none" stroke="#655D7B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .cn { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <!-- soft background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="112" cy="115" r="72" fill="#D9E7FF" opacity="0.55"/>
  <circle cx="1170" cy="105" r="102" fill="#FFE9C8" opacity="0.55"/>
  <circle cx="1187" cy="635" r="120" fill="#E8DCFF" opacity="0.42"/>
  <path d="M52 594 C174 535 214 657 345 603" fill="none" stroke="#B9C8F7" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 14" opacity="0.65"/>
  <g fill="#8B5CF6" opacity="0.34">
    <circle cx="92" cy="628" r="5"/><circle cx="119" cy="628" r="3"/><circle cx="1088" cy="180" r="4"/>
  </g>
  <g stroke="#F0A04A" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M1058 76v14M1051 83h14"/><path d="M375 100v12M369 106h12"/>
  </g>

  <!-- heading -->
  <g class="cn">
    <rect x="70" y="62" width="116" height="34" rx="17" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="91" cy="79" r="7" fill="#8B5CF6"/>
    <text x="108" y="85" font-size="16" font-weight="700" fill="#6D4AE8">AGENT 生态</text>
    <text x="70" y="144" font-size="43" font-weight="800" fill="#29243A" letter-spacing="1">三层装备如何分工？</text>
    <text x="72" y="178" font-size="17" fill="#716B82">从基础能力到工作方法，再到随取随用的内容储备</text>
  </g>

  <!-- left zone label -->
  <g class="cn">
    <rect x="70" y="211" width="642" height="444" rx="30" fill="#FFFFFF" opacity="0.66" stroke="#FFFFFF" stroke-width="2"/>
    <text x="99" y="247" font-size="15" font-weight="700" fill="#797287" letter-spacing="2">核心能力栈</text>
  </g>

  <!-- upward relationship arrows -->
  <g class="cn" fill="#655D7B">
    <path d="M620 545 V510" fill="none" stroke="#655D7B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowUp)"/>
    <rect x="536" y="514" width="68" height="24" rx="12" fill="#F2EEF8"/>
    <text x="570" y="531" text-anchor="middle" font-size="13" font-weight="700">底座托起</text>
    <path d="M620 420 V385" fill="none" stroke="#655D7B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowUp)"/>
    <rect x="536" y="389" width="68" height="24" rx="12" fill="#F2EEF8"/>
    <text x="570" y="406" text-anchor="middle" font-size="13" font-weight="700">插件托起</text>
  </g>

  <!-- layer 3: skills -->
  <g filter="url(#shadow)">
    <rect x="102" y="268" width="500" height="110" rx="22" fill="url(#skill)"/>
  </g>
  <g class="cn">
    <rect x="122" y="288" width="66" height="30" rx="15" fill="#FFFFFF" opacity="0.2"/>
    <text x="155" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">03</text>
    <text x="204" y="311" font-size="23" font-weight="800" fill="#FFFFFF">Skills 技能层</text>
    <text x="204" y="342" font-size="16" fill="#EEE8FF">教 Agent 怎么做（SOP）</text>
  </g>
  <g class="mono" font-size="13" font-weight="700" fill="#5D3BCC">
    <rect x="122" y="350" width="102" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="173" y="367" text-anchor="middle">archify</text>
    <rect x="232" y="350" width="112" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="288" y="367" text-anchor="middle">humanizer</text>
    <rect x="352" y="350" width="158" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="431" y="367" text-anchor="middle">diagram-design</text>
  </g>
  <!-- skill icon -->
  <g transform="translate(537 291)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M9 6h28v34H9z"/><path d="M16 2v8M30 2v8M16 18h14M16 25h14M16 32h9"/>
  </g>

  <!-- layer 2: plugins -->
  <g filter="url(#shadow)">
    <rect x="122" y="393" width="500" height="110" rx="22" fill="url(#plugin)"/>
  </g>
  <g class="cn">
    <rect x="142" y="413" width="66" height="30" rx="15" fill="#FFFFFF" opacity="0.2"/>
    <text x="175" y="434" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">02</text>
    <text x="224" y="436" font-size="23" font-weight="800" fill="#FFFFFF">Plugins 插件层</text>
    <text x="224" y="467" font-size="16" fill="#DCF9FC">给 Agent 加工具（MCP）</text>
  </g>
  <g class="mono" font-size="12.5" font-weight="700" fill="#087B91">
    <rect x="142" y="475" width="180" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="232" y="492" text-anchor="middle">chrome-devtools-mcp</text>
    <rect x="330" y="475" width="132" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="396" y="492" text-anchor="middle">context-mode</text>
    <rect x="470" y="475" width="70" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="505" y="492" text-anchor="middle">ruflo</text>
  </g>
  <!-- plugin icon -->
  <g transform="translate(554 415)" fill="#FFFFFF" opacity="0.9">
    <path d="M10 0h10v10a5 5 0 1 0 10 0V0h10v14H30a5 5 0 0 0 0 10h10v14H26V28a5 5 0 1 0-10 0v10H2V24h10a5 5 0 1 0 0-10H2V0z"/>
  </g>

  <!-- layer 1: tools -->
  <g filter="url(#shadow)">
    <rect x="142" y="518" width="500" height="110" rx="22" fill="url(#tool)"/>
  </g>
  <g class="cn">
    <rect x="162" y="538" width="66" height="30" rx="15" fill="#FFFFFF" opacity="0.22"/>
    <text x="195" y="559" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">01</text>
    <text x="244" y="561" font-size="23" font-weight="800" fill="#FFFFFF">工具底座</text>
    <text x="244" y="592" font-size="16" fill="#FFF4E7">干活的地基</text>
  </g>
  <g class="mono" font-size="13" font-weight="700" fill="#C45E1C">
    <rect x="162" y="600" width="112" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="218" y="617" text-anchor="middle">markitdown</text>
    <rect x="282" y="600" width="104" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="334" y="617" text-anchor="middle">openclaw</text>
    <rect x="394" y="600" width="104" height="25" rx="12.5" fill="#FFFFFF"/>
    <text x="446" y="617" text-anchor="middle">cc-switch</text>
  </g>
  <!-- tool icon -->
  <g transform="translate(568 541)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M6 34L25 15"/><path d="M20 9l6-6 8 2 2 8-6 6-7-2-3-8z"/><path d="M4 31l6 6"/>
  </g>

  <!-- right ammunition library -->
  <g class="cn">
    <rect x="750" y="211" width="460" height="444" rx="30" fill="#FFFFFF" opacity="0.74" stroke="#FFFFFF" stroke-width="2"/>
    <text x="780" y="247" font-size="15" font-weight="700" fill="#797287" letter-spacing="2">内容储备</text>
  </g>

  <!-- floating sparkles -->
  <g fill="#8B5CF6">
    <path d="M1124 286l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" opacity="0.8"/>
    <circle cx="1160" cy="340" r="5" opacity="0.45"/>
  </g>

  <!-- ammo box -->
  <g filter="url(#shadow)">
    <path d="M820 365h320a20 20 0 0 1 20 20v173a24 24 0 0 1-24 24H824a24 24 0 0 1-24-24V385a20 20 0 0 1 20-20z" fill="url(#crate)"/>
    <path d="M820 365h320a20 20 0 0 1 20 20v32H800v-32a20 20 0 0 1 20-20z" fill="#FFC768"/>
    <rect x="782" y="345" width="396" height="42" rx="16" fill="#6D4AE8"/>
    <rect x="942" y="324" width="76" height="31" rx="14" fill="none" stroke="#6D4AE8" stroke-width="10"/>
  </g>
  <!-- box planks and hardware -->
  <path d="M822 427h316M822 526h316" stroke="#D8752B" stroke-width="4" opacity="0.65"/>
  <path d="M846 392v166M1114 392v166" stroke="#D8752B" stroke-width="13" opacity="0.72"/>
  <rect x="945" y="449" width="70" height="54" rx="12" fill="#FFF2D1" stroke="#D8752B" stroke-width="4"/>
  <circle cx="980" cy="470" r="8" fill="#6D4AE8"/>
  <path d="M980 478v12" stroke="#6D4AE8" stroke-width="6" stroke-linecap="round"/>

  <!-- ammunition cards emerging -->
  <g filter="url(#smallShadow)">
    <g transform="rotate(-5 908 343)">
      <rect x="831" y="273" width="176" height="91" rx="16" fill="#FFFFFF"/>
      <rect x="844" y="288" width="35" height="35" rx="10" fill="#EAE3FF"/>
      <path d="M853 313l8-15 8 15M856 308h10" stroke="#7A57E8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="890" y="304" class="mono" font-size="12" font-weight="800" fill="#3B3450">awesome-gpt-</text>
      <text x="890" y="321" class="mono" font-size="12" font-weight="800" fill="#3B3450">image-2</text>
      <rect x="844" y="337" width="102" height="7" rx="3.5" fill="#EDEAF4"/>
    </g>
    <g transform="rotate(5 1050 344)">
      <rect x="984" y="279" width="168" height="89" rx="16" fill="#FFFFFF"/>
      <rect x="997" y="294" width="35" height="35" rx="10" fill="#DDF8F8"/>
      <path d="M1007 303h15M1007 310h15M1007 317h10" stroke="#1599B3" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1041" y="309" class="mono" font-size="11.5" font-weight="800" fill="#3B3450">ai-research-</text>
      <text x="1041" y="326" class="mono" font-size="11.5" font-weight="800" fill="#3B3450">writing</text>
      <rect x="997" y="342" width="98" height="7" rx="3.5" fill="#EDEAF4"/>
    </g>
  </g>

  <!-- crate title plate -->
  <g class="cn">
    <rect x="868" y="396" width="224" height="39" rx="19.5" fill="#FFFFFF"/>
    <text x="980" y="422" text-anchor="middle" font-size="21" font-weight="900" fill="#6D4AE8">提示词弹药库</text>
    <rect x="885" y="544" width="190" height="30" rx="15" fill="#683D26" opacity="0.18"/>
    <text x="980" y="565" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">随时取用的弹药</text>
  </g>

  <!-- footer legend -->
  <g class="cn">
    <rect x="429" y="674" width="422" height="28" rx="14" fill="#FFFFFF" opacity="0.78"/>
    <text x="640" y="694" text-anchor="middle" font-size="13" font-weight="700" fill="#756E82">工具提供能力 · 插件完成连接 · 技能沉淀方法 · 提示词快速补给</text>
  </g>
</svg>
